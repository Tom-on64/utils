<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
	<title>My Utilities</title>
	<link rel="stylesheet" href="/global/style.css">
	<script src="/global/pagegen.js" defer></script>

	<link rel="stylesheet" href="ascii.css">
	<script src="ascii.js" defer></script>
</head>
<body>
	<nav id="nav"></nav>
	<main>
		<h1>ASCII table</h1>
		<div class="container">
			<article class="table" id="table"></article>
			<article class="infobox">
				<h2 class="chr" id="chr"></h2>
				<p class="lore" id="lore"></p>
				<p>Hex: 0x<span class="hex" id="hex"></span></p>
				<p>Dec: <span class="dec" id="dec"></span></p>
				<p>Bin: <span class="bin" id="bin"><span></p>
			</article>
		</div>
	</main>
	<footer id="footer"></footer>
</body>
</html>
