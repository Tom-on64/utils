<!DOCTYPE html>
<!-- NOTE: TS je cely AI slop, ktery pouzivam jako inspiraci pro to jak to udelat -->
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Paint</title>
		<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }

body {
	font-family: 'Tahoma', 'MS Sans Serif', sans-serif;
	font-size: 11px;
	background: #008080;
	display: flex;
	flex-direction: column;
	height: 100vh;
	overflow: hidden;
}

  /* ── Window chrome ── */
  #app-window {
	  display: flex;
	  flex-direction: column;
	  height: 100vh;
	  background: #d4d0c8;
	  border: 2px solid;
	  border-color: #ffffff #808080 #808080 #ffffff;
	  box-shadow: 1px 1px 0 #000;
  }

  #title-bar {
	  background: linear-gradient(to right, #0a246a, #a6caf0);
	  color: white;
	  padding: 3px 6px;
	  display: flex;
	  align-items: center;
	  gap: 6px;
	  font-weight: bold;
	  font-size: 11px;
	  flex-shrink: 0;
  }
  #title-bar img { width: 16px; height: 16px; }
  #title-bar span { flex: 1; }
  .title-btn {
	  width: 16px; height: 14px;
	  background: #d4d0c8;
	  border: 1px solid; border-color: #fff #808080 #808080 #fff;
	  display: flex; align-items: center; justify-content: center;
	  cursor: pointer; font-size: 9px; font-weight: bold; color: #000;
	  box-shadow: inset 1px 1px #fff, inset -1px -1px #808080;
  }

  /* ── Menu bar ── */
  #menu-bar {
	  background: #d4d0c8;
	  padding: 2px 4px;
	  display: flex;
	  gap: 2px;
	  border-bottom: 1px solid #808080;
	  flex-shrink: 0;
  }
  .menu-item {
	  padding: 2px 6px;
	  cursor: pointer;
	  border: 1px solid transparent;
  }
  .menu-item:hover {
	  border-color: #0a246a;
	  background: #0a246a;
	  color: white;
  }

  /* ── Toolbar ── */
  #toolbar {
	  display: flex;
	  align-items: center;
	  gap: 0;
	  background: #d4d0c8;
	  border-bottom: 2px solid;
	  border-color: #808080 #ffffff #ffffff #808080;
	  padding: 2px 4px;
	  flex-shrink: 0;
	  flex-wrap: wrap;
  }
  .toolbar-separator {
	  width: 1px; height: 22px;
	  background: #808080;
	  margin: 0 4px;
	  box-shadow: 1px 0 #fff;
  }
  .tool-btn {
	  width: 24px; height: 24px;
	  background: #d4d0c8;
	  border: 1px solid transparent;
	  display: flex; align-items: center; justify-content: center;
	  cursor: pointer;
	  position: relative;
	  font-size: 14px;
	  flex-shrink: 0;
  }
  .tool-btn:hover {
	  border-color: #ffffff #808080 #808080 #ffffff;
	  box-shadow: inset 1px 1px #dfdfdf;
  }
  .tool-btn.active {
	  border-color: #808080 #ffffff #ffffff #808080;
	  box-shadow: inset 1px 1px #808080;
	  background: #c0bdb5;
  }
  .tool-btn svg { pointer-events: none; }

  /* size picker */
  #size-picker {
	  display: flex; flex-direction: column; gap: 3px; padding: 2px 6px; align-items: flex-start;
  }
  .size-opt {
	  display: flex; align-items: center; gap: 4px; cursor: pointer;
  }
  .size-dot {
	  background: #000; border-radius: 50%;
  }
  .size-opt.active .size-dot { background: #0000ff; }
  .size-label { font-size: 10px; color: #444; }

  /* ── Main content area ── */
  #main-area {
	  display: flex;
	  flex: 1;
	  overflow: hidden;
	  min-height: 0;
  }

  /* ── Left toolbox ── */
  #toolbox {
	  width: 54px;
	  background: #d4d0c8;
	  border-right: 2px solid;
	  border-color: #808080 #ffffff #ffffff #808080;
	  display: flex;
	  flex-direction: column;
	  padding: 4px 2px;
	  gap: 2px;
	  flex-shrink: 0;
	  overflow-y: auto;
  }
  .toolbox-grid {
	  display: grid;
	  grid-template-columns: 1fr 1fr;
	  gap: 2px;
  }
  .tool-icon {
	  width: 24px; height: 24px;
	  background: #d4d0c8;
	  border: 1px solid transparent;
	  display: flex; align-items: center; justify-content: center;
	  cursor: pointer;
	  font-size: 13px;
  }
  .tool-icon:hover {
	  border-color: #ffffff #808080 #808080 #ffffff;
  }
  .tool-icon.active {
	  border-color: #808080 #ffffff #ffffff #808080;
	  background: #b8b4ad;
	  box-shadow: inset 1px 1px #808080;
  }
  .toolbox-sep {
	  height: 1px; background: #808080; margin: 3px 2px;
	  box-shadow: 0 1px #fff;
  }

  /* brush size panel inside toolbox */
  #brush-options {
	  padding: 4px 2px;
  }
  #brush-options .opt-label { font-size: 10px; color: #555; margin-bottom: 3px; }
  .brush-size-row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .bsize-btn {
	  border: 1px solid transparent; border-radius: 50%; background: #000;
	  cursor: pointer; flex-shrink: 0;
  }
  .bsize-btn:hover { outline: 2px solid #0a246a; }
  .bsize-btn.active { outline: 2px solid #0000cc; }

  /* ── Color palette ── */
  #palette-area {
	  background: #d4d0c8;
	  border-top: 2px solid;
	  border-color: #808080 #ffffff #ffffff #808080;
	  padding: 4px 6px;
	  display: flex;
	  align-items: center;
	  gap: 8px;
	  flex-shrink: 0;
  }
  #color-display {
	  position: relative; width: 40px; height: 32px; flex-shrink: 0;
  }
  #bg-color-box {
	  position: absolute; bottom: 0; right: 0;
	  width: 24px; height: 24px;
	  border: 2px solid; border-color: #808080 #ffffff #ffffff #808080;
	  cursor: pointer;
  }
  #fg-color-box {
	  position: absolute; top: 0; left: 0;
	  width: 24px; height: 24px;
	  border: 2px solid; border-color: #ffffff #808080 #808080 #ffffff;
	  cursor: pointer;
	  z-index: 1;
  }
  #swap-btn {
	  position: absolute; bottom: 0; left: 0;
	  width: 12px; height: 12px;
	  background: #d4d0c8;
	  border: 1px solid #808080;
	  cursor: pointer;
	  font-size: 9px;
	  display: flex; align-items: center; justify-content: center;
	  z-index: 2;
  }
  #color-grid {
	  display: grid;
	  grid-template-columns: repeat(20, 16px);
	  grid-template-rows: repeat(2, 16px);
	  gap: 1px;
  }
  .color-swatch {
	  width: 16px; height: 16px;
	  border: 1px solid; border-color: #808080 #ffffff #ffffff #808080;
	  cursor: pointer;
	  flex-shrink: 0;
  }
  .color-swatch:hover {
	  outline: 2px solid #000;
	  z-index: 1;
	  position: relative;
  }
  #custom-color-btn {
	  font-size: 10px; padding: 2px 6px;
	  background: #d4d0c8;
	  border: 1px solid; border-color: #ffffff #808080 #808080 #ffffff;
	  cursor: pointer;
	  white-space: nowrap;
  }
  #custom-color-btn:active {
	  border-color: #808080 #ffffff #ffffff #808080;
  }

  /* ── Canvas area ── */
  #canvas-container {
	  flex: 1;
	  overflow: auto;
	  background: #808080;
	  padding: 8px;
	  position: relative;
  }
  #canvas-wrapper {
	  position: relative;
	  display: inline-block;
	  line-height: 0;
	  box-shadow: 2px 2px 4px rgba(0,0,0,0.5);
  }
  #main-canvas {
	  display: block;
	  cursor: crosshair;
	  background: #ffffff;
	  image-rendering: pixelated;
  }
  /* overlay canvas for shape previews */
  #overlay-canvas {
	  position: absolute;
	  top: 0; left: 0;
	  pointer-events: none;
	  image-rendering: pixelated;
  }

  /* ── Status bar ── */
  #status-bar {
	  background: #d4d0c8;
	  border-top: 1px solid #808080;
	  padding: 2px 8px;
	  display: flex;
	  gap: 16px;
	  font-size: 10px;
	  flex-shrink: 0;
  }
  .status-cell {
	  border: 1px solid; border-color: #808080 #ffffff #ffffff #808080;
	  padding: 1px 6px;
	  min-width: 80px;
  }

  /* ── Tooltip ── */
  .tooltip {
	  position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
	  background: #ffffe1; border: 1px solid #000;
	  padding: 2px 4px; font-size: 10px; white-space: nowrap;
	  pointer-events: none; z-index: 100; display: none;
  }
  .tool-icon:hover .tooltip, .tool-btn:hover .tooltip { display: block; }

  /* color picker modal */
  #color-modal {
	  display: none; position: fixed; inset: 0;
	  background: rgba(0,0,0,0.4); z-index: 999;
	  align-items: center; justify-content: center;
  }
  #color-modal.open { display: flex; }
  #color-modal-inner {
	  background: #d4d0c8;
	  border: 2px solid; border-color: #fff #808080 #808080 #fff;
	  padding: 12px; width: 300px;
  }
  #color-modal h3 { margin-bottom: 8px; font-size: 12px; }
  #color-picker-input { width: 100%; height: 36px; border: none; cursor: pointer; }
  .modal-btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 10px; }
  .modal-btn {
	  padding: 3px 14px; background: #d4d0c8; font-family: inherit; font-size: 11px;
	  border: 1px solid; border-color: #fff #808080 #808080 #fff; cursor: pointer;
  }
  .modal-btn:active { border-color: #808080 #fff #fff #808080; }
		</style>
	</head>
	<body>

		<div id="app-window">
			<!-- Title bar -->
			<div id="title-bar">
				<svg width="16" height="16" viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="6" fill="#ff0000"/><rect x="9" y="1" width="6" height="6" fill="#00ff00"/><rect x="1" y="9" width="6" height="6" fill="#0000ff"/><rect x="9" y="9" width="6" height="6" fill="#ffff00"/></svg>
				<span>untitled - Paint</span>
				<div class="title-btn">_</div>
				<div class="title-btn">□</div>
				<div class="title-btn" style="font-size:11px">✕</div>
			</div>

			<!-- Menu bar -->
			<div id="menu-bar">
				<div class="menu-item">File</div>
				<div class="menu-item">Edit</div>
				<div class="menu-item">View</div>
				<div class="menu-item">Image</div>
				<div class="menu-item">Colors</div>
				<div class="menu-item">Help</div>
			</div>

			<!-- Toolbar -->
			<div id="toolbar">
				<!-- Undo / Redo -->
				<button class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)">
					<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
						<path d="M4 6 L2 8 L4 10" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
						<path d="M2 8 Q6 2 12 6 Q14 8 13 11" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
					</svg>
					<span class="tooltip">Undo (Ctrl+Z)</span>
				</button>
				<button class="tool-btn" id="btn-redo" title="Redo (Ctrl+Y)">
					<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
						<path d="M12 6 L14 8 L12 10" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
						<path d="M14 8 Q10 2 4 6 Q2 8 3 11" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
					</svg>
					<span class="tooltip">Redo (Ctrl+Y)</span>
				</button>
				<div class="toolbar-separator"></div>
				<!-- New / Clear -->
				<button class="tool-btn" id="btn-new" title="New">
					<svg width="16" height="16" viewBox="0 0 16 16"><rect x="2" y="2" width="10" height="12" fill="#fff" stroke="#000"/><polygon points="10,2 14,6 10,6" fill="#c0c0c0" stroke="#000"/><line x1="10" y1="2" x2="10" y2="6" stroke="#000"/><line x1="10" y1="6" x2="14" y2="6" stroke="#000"/></svg>
					<span class="tooltip">New</span>
				</button>
				<div class="toolbar-separator"></div>
				<!-- Brush size presets in toolbar -->
				<div id="size-picker">
					<div class="size-opt active" data-size="1">
						<div class="size-dot" style="width:2px;height:2px"></div>
						<span class="size-label">1px</span>
					</div>
					<div class="size-opt" data-size="3">
						<div class="size-dot" style="width:5px;height:5px"></div>
						<span class="size-label">3px</span>
					</div>
					<div class="size-opt" data-size="6">
						<div class="size-dot" style="width:8px;height:8px"></div>
						<span class="size-label">6px</span>
					</div>
					<div class="size-opt" data-size="12">
						<div class="size-dot" style="width:12px;height:12px"></div>
						<span class="size-label">12px</span>
					</div>
				</div>
			</div>

			<!-- Main area -->
			<div id="main-area">
				<!-- Left toolbox -->
				<div id="toolbox">
					<div class="toolbox-grid">
						<!-- Brushes -->
						<div class="tool-icon active" data-tool="pencil" title="Pencil">
							✏️<span class="tooltip">Pencil</span>
						</div>
						<div class="tool-icon" data-tool="brush_circle" title="Round Brush">
							🖌️<span class="tooltip">Round Brush</span>
						</div>
						<div class="tool-icon" data-tool="spray" title="Spray">
							💨<span class="tooltip">Spray</span>
						</div>
						<div class="tool-icon" data-tool="eraser" title="Eraser">
							🧹<span class="tooltip">Eraser</span>
						</div>
						<div class="tool-icon" data-tool="fill" title="Fill">
							🪣<span class="tooltip">Fill (Bucket)</span>
						</div>
						<div class="tool-icon" data-tool="eyedropper" title="Color Picker">
							💉<span class="tooltip">Color Picker</span>
						</div>
					</div>

					<div class="toolbox-sep"></div>

					<!-- Shapes -->
					<div style="font-size:9px;color:#555;padding:0 2px;margin-bottom:2px;">Shapes</div>
					<div class="toolbox-grid">
						<div class="tool-icon" data-tool="line" title="Line">
							<svg width="16" height="16"><line x1="2" y1="14" x2="14" y2="2" stroke="#000" stroke-width="1.5"/></svg>
							<span class="tooltip">Line</span>
						</div>
						<div class="tool-icon" data-tool="rect" title="Rectangle">
							<svg width="16" height="16"><rect x="2" y="4" width="12" height="8" fill="none" stroke="#000" stroke-width="1.5"/></svg>
							<span class="tooltip">Rectangle</span>
						</div>
						<div class="tool-icon" data-tool="filled_rect" title="Filled Rect">
							<svg width="16" height="16"><rect x="2" y="4" width="12" height="8" fill="#000"/></svg>
							<span class="tooltip">Filled Rectangle</span>
						</div>
						<div class="tool-icon" data-tool="ellipse" title="Ellipse">
							<svg width="16" height="16"><ellipse cx="8" cy="8" rx="6" ry="4" fill="none" stroke="#000" stroke-width="1.5"/></svg>
							<span class="tooltip">Ellipse</span>
						</div>
						<div class="tool-icon" data-tool="filled_ellipse" title="Filled Ellipse">
							<svg width="16" height="16"><ellipse cx="8" cy="8" rx="6" ry="4" fill="#000"/></svg>
							<span class="tooltip">Filled Ellipse</span>
						</div>
						<div class="tool-icon" data-tool="circle" title="Circle">
							<svg width="16" height="16"><circle cx="8" cy="8" r="5" fill="none" stroke="#000" stroke-width="1.5"/></svg>
							<span class="tooltip">Circle</span>
						</div>
						<div class="tool-icon" data-tool="filled_circle" title="Filled Circle">
							<svg width="16" height="16"><circle cx="8" cy="8" r="5" fill="#000"/></svg>
							<span class="tooltip">Filled Circle</span>
						</div>
						<div class="tool-icon" data-tool="star" title="Star">
							<svg width="16" height="16"><polygon points="8,1 9.9,6.5 15.5,6.5 11,10 12.9,15.5 8,12 3.1,15.5 5,10 0.5,6.5 6.1,6.5" fill="#000"/></svg>
							<span class="tooltip">Star</span>
						</div>
					</div>

					<div class="toolbox-sep"></div>
					<div id="brush-options">
						<div class="opt-label">Size</div>
						<div class="brush-size-row" id="bsize-row"></div>
					</div>
				</div>

				<!-- Canvas -->
				<div id="canvas-container">
					<div id="canvas-wrapper">
						<canvas id="main-canvas" width="800" height="600"></canvas>
						<canvas id="overlay-canvas" width="800" height="600"></canvas>
					</div>
				</div>
			</div>

			<!-- Color palette -->
			<div id="palette-area">
				<div id="color-display">
					<div id="bg-color-box" title="Background color (right-click swatches)"></div>
					<div id="fg-color-box" title="Foreground color (left-click swatches)"></div>
					<div id="swap-btn" title="Swap colors (X)">↔</div>
				</div>
				<div id="color-grid"></div>
				<button id="custom-color-btn">Edit Colors…</button>
			</div>

			<!-- Status bar -->
			<div id="status-bar">
				<div class="status-cell" id="status-tool">Tool: Pencil</div>
				<div class="status-cell" id="status-pos">0, 0</div>
				<div class="status-cell" id="status-size">800 × 600</div>
			</div>
		</div>

		<!-- Color modal -->
		<div id="color-modal">
			<div id="color-modal-inner">
				<h3>Edit Custom Color</h3>
				<input type="color" id="color-picker-input">
				<div class="modal-btns">
					<button class="modal-btn" id="modal-ok">OK</button>
					<button class="modal-btn" id="modal-cancel">Cancel</button>
				</div>
			</div>
		</div>

		<script>
			// ══════════════════════════════════════════════════════════════
			//  CONFIGURATION — edit freely to extend or tweak behaviour
			// ══════════════════════════════════════════════════════════════
			const CONFIG = {
				canvasWidth: 800,
				canvasHeight: 600,
				defaultFg: '#000000',
				defaultBg: '#ffffff',
				maxUndo: 50,
				sprayDensity: 12,      // particles per spray tick
				sprayRadius: 18,       // px radius of spray cloud

				// MS Paint XP default palette (2 rows × 20 cols)
				palette: [
					'#000000','#808080','#800000','#808000','#008000','#008080','#000080','#800080','#808040','#004040',
					'#0080ff','#004080','#8000ff','#804000','#ff0000','#ff8000',
					'#ffff00','#80ff00','#00ff00','#00ff80',

					'#ffffff','#c0c0c0','#ff8080','#ffff80','#80ff80','#00ffff','#80d0ff','#ff80ff','#ffff40','#80ffff',
					'#0000ff','#6060ff','#ff00ff','#804080','#ff80c0','#ffc0ff',
					'#ffffc0','#c0ffc0','#c0c0ff','#c0ffff',
				],

				// Brush size presets shown in the left panel
				brushSizes: [1, 2, 4, 8, 12, 20],

				// Tool definitions — add new tools here
				tools: {
					pencil:         { label: 'Pencil',           cursor: 'crosshair' },
					brush_circle:   { label: 'Round Brush',      cursor: 'crosshair' },
					spray:          { label: 'Spray',            cursor: 'crosshair' },
					eraser:         { label: 'Eraser',           cursor: 'cell' },
					fill:           { label: 'Fill',             cursor: 'cell' },
					eyedropper:     { label: 'Color Picker',     cursor: 'eyedropper' },
					line:           { label: 'Line',             cursor: 'crosshair' },
					rect:           { label: 'Rectangle',        cursor: 'crosshair' },
					filled_rect:    { label: 'Filled Rectangle', cursor: 'crosshair' },
					ellipse:        { label: 'Ellipse',          cursor: 'crosshair' },
					filled_ellipse: { label: 'Filled Ellipse',   cursor: 'crosshair' },
					circle:         { label: 'Circle',           cursor: 'crosshair' },
					filled_circle:  { label: 'Filled Circle',    cursor: 'crosshair' },
					star:           { label: 'Star',             cursor: 'crosshair' },
				}
			};

			// ══════════════════════════════════════════════════════════════
			//  STATE
			// ══════════════════════════════════════════════════════════════
			const state = {
				tool: 'pencil',
				brushSize: 1,
				fg: CONFIG.defaultFg,
				bg: CONFIG.defaultBg,
				isDrawing: false,
				startX: 0, startY: 0,
				lastX: 0, lastY: 0,
				undoStack: [],
				redoStack: [],
				sprayTimer: null,
				colorTarget: 'fg',   // which slot is being edited
			};

			// ══════════════════════════════════════════════════════════════
			//  CANVAS SETUP
			// ══════════════════════════════════════════════════════════════
			const mainCanvas = document.getElementById('main-canvas');
			const overlayCanvas = document.getElementById('overlay-canvas');
			const ctx = mainCanvas.getContext('2d', { willReadFrequently: true });
			const octx = overlayCanvas.getContext('2d');

			function resizeCanvas(w, h) {
				// preserve content
				const img = ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
				mainCanvas.width = overlayCanvas.width = w;
				mainCanvas.height = overlayCanvas.height = h;
				ctx.fillStyle = '#ffffff';
				ctx.fillRect(0, 0, w, h);
				ctx.putImageData(img, 0, 0);
				document.getElementById('status-size').textContent = `${w} × ${h}`;
			}

			function clearOverlay() {
				octx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
			}

			// ══════════════════════════════════════════════════════════════
			//  UNDO / REDO
			// ══════════════════════════════════════════════════════════════
			function saveState() {
				state.undoStack.push(ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height));
				if (state.undoStack.length > CONFIG.maxUndo) state.undoStack.shift();
				state.redoStack = [];
			}

			function undo() {
				if (!state.undoStack.length) return;
				state.redoStack.push(ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height));
				ctx.putImageData(state.undoStack.pop(), 0, 0);
			}

			function redo() {
				if (!state.redoStack.length) return;
				state.undoStack.push(ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height));
				ctx.putImageData(state.redoStack.pop(), 0, 0);
			}

			// ══════════════════════════════════════════════════════════════
			//  DRAWING HELPERS
			// ══════════════════════════════════════════════════════════════
			function getCanvasPos(e) {
				const r = mainCanvas.getBoundingClientRect();
				return {
					x: Math.round(e.clientX - r.left),
					y: Math.round(e.clientY - r.top)
				};
			}

			function activeColor(e) {
				return e.button === 2 ? state.bg : state.fg;
			}

			// pixel-exact square brush
			function drawSquare(cx, cy, size, color) {
				ctx.fillStyle = color;
				const half = Math.floor(size / 2);
				ctx.fillRect(cx - half, cy - half, size, size);
			}

			// circle brush
			function drawCircleBrush(cx, cy, size, color) {
				ctx.fillStyle = color;
				ctx.beginPath();
				ctx.arc(cx, cy, size / 2, 0, Math.PI * 2);
				ctx.fill();
			}

			// line between two points using square brush
			function drawLineTo(x0, y0, x1, y1, size, color) {
				const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
				const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
				let err = dx - dy, x = x0, y = y0;
				while (true) {
					drawSquare(x, y, size, color);
					if (x === x1 && y === y1) break;
					const e2 = 2 * err;
					if (e2 > -dy) { err -= dy; x += sx; }
					if (e2 < dx)  { err += dx; y += sy; }
				}
			}

			// spray noise
			function sprayAt(cx, cy, color) {
				ctx.fillStyle = color;
				for (let i = 0; i < CONFIG.sprayDensity; i++) {
					const angle = Math.random() * Math.PI * 2;
					const r = Math.random() * CONFIG.sprayRadius;
					ctx.fillRect(
						Math.round(cx + r * Math.cos(angle)),
						Math.round(cy + r * Math.sin(angle)),
						1, 1
					);
				}
			}

			// bucket fill (flood fill with tolerance 0)
			function floodFill(x, y, fillColor) {
				const imgData = ctx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
				const data = imgData.data;
				const W = mainCanvas.width, H = mainCanvas.height;
				const idx = (px, py) => (py * W + px) * 4;

				const tc = hexToRgb(fillColor);
				const si = idx(x, y);
				const tr = data[si], tg = data[si+1], tb = data[si+2], ta = data[si+3];
				if (tr === tc.r && tg === tc.g && tb === tc.b && ta === 255) return;

				const stack = [[x, y]];
				const visited = new Uint8Array(W * H);

				while (stack.length) {
					const [px, py] = stack.pop();
					if (px < 0 || px >= W || py < 0 || py >= H) continue;
					if (visited[py * W + px]) continue;
					const i = idx(px, py);
					if (data[i] !== tr || data[i+1] !== tg || data[i+2] !== tb || data[i+3] !== ta) continue;
					visited[py * W + px] = 1;
					data[i] = tc.r; data[i+1] = tc.g; data[i+2] = tc.b; data[i+3] = 255;
					stack.push([px-1,py],[px+1,py],[px,py-1],[px,py+1]);
				}
				ctx.putImageData(imgData, 0, 0);
			}

			function hexToRgb(hex) {
				const r = parseInt(hex.slice(1,3), 16);
				const g = parseInt(hex.slice(3,5), 16);
				const b = parseInt(hex.slice(5,7), 16);
				return { r, g, b };
			}

			function rgbToHex(r, g, b) {
				return '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
			}

			// ── Shape preview on overlay ──
			function previewShape(x0, y0, x1, y1, color, tool, e) {
				clearOverlay();
				octx.strokeStyle = color;
				octx.fillStyle = color;
				octx.lineWidth = state.brushSize;

				const shift = e && e.shiftKey;

				switch(tool) {
					case 'line':
						octx.beginPath(); octx.moveTo(x0, y0); octx.lineTo(x1, y1); octx.stroke();
						break;
					case 'rect':
						octx.strokeRect(x0, y0, x1-x0, y1-y0);
						break;
					case 'filled_rect':
						octx.fillRect(x0, y0, x1-x0, y1-y0);
						break;
					case 'ellipse': {
						const rx = Math.abs(x1-x0)/2, ry = Math.abs(y1-y0)/2;
						const cx = (x0+x1)/2, cy = (y0+y1)/2;
						octx.beginPath(); octx.ellipse(cx, cy, rx||1, ry||1, 0, 0, Math.PI*2);
						octx.stroke();
						break;
					}
					case 'filled_ellipse': {
						const rx = Math.abs(x1-x0)/2, ry = Math.abs(y1-y0)/2;
						const cx = (x0+x1)/2, cy = (y0+y1)/2;
						octx.beginPath(); octx.ellipse(cx, cy, rx||1, ry||1, 0, 0, Math.PI*2);
						octx.fill();
						break;
					}
					case 'circle':
					case 'filled_circle': {
						let r = Math.sqrt((x1-x0)**2+(y1-y0)**2);
						if (shift) r = Math.max(Math.abs(x1-x0), Math.abs(y1-y0));
						octx.beginPath(); octx.arc(x0, y0, r, 0, Math.PI*2);
						tool === 'filled_circle' ? octx.fill() : octx.stroke();
						break;
					}
					case 'star': {
						const r = Math.sqrt((x1-x0)**2+(y1-y0)**2);
						drawStar(octx, x0, y0, 5, r, r*0.4);
						octx.fillStyle = color; octx.fill();
						break;
					}
				}
			}

			function commitShape(x0, y0, x1, y1, color, tool, e) {
				clearOverlay();
				ctx.strokeStyle = color;
				ctx.fillStyle = color;
				ctx.lineWidth = state.brushSize;
				const shift = e && e.shiftKey;

				switch(tool) {
					case 'line':
						ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
						break;
					case 'rect':
						ctx.strokeRect(x0, y0, x1-x0, y1-y0);
						break;
					case 'filled_rect':
						ctx.fillRect(x0, y0, x1-x0, y1-y0);
						break;
					case 'ellipse': {
						const rx = Math.abs(x1-x0)/2, ry = Math.abs(y1-y0)/2;
						const cx = (x0+x1)/2, cy = (y0+y1)/2;
						ctx.beginPath(); ctx.ellipse(cx, cy, rx||1, ry||1, 0, 0, Math.PI*2);
						ctx.stroke();
						break;
					}
					case 'filled_ellipse': {
						const rx = Math.abs(x1-x0)/2, ry = Math.abs(y1-y0)/2;
						const cx = (x0+x1)/2, cy = (y0+y1)/2;
						ctx.beginPath(); ctx.ellipse(cx, cy, rx||1, ry||1, 0, 0, Math.PI*2);
						ctx.fill();
						break;
					}
					case 'circle':
					case 'filled_circle': {
						let r = Math.sqrt((x1-x0)**2+(y1-y0)**2);
						ctx.beginPath(); ctx.arc(x0, y0, r, 0, Math.PI*2);
						tool === 'filled_circle' ? ctx.fill() : ctx.stroke();
						break;
					}
					case 'star': {
						const r = Math.sqrt((x1-x0)**2+(y1-y0)**2);
						drawStar(ctx, x0, y0, 5, r, r*0.4);
						ctx.fill();
						break;
					}
				}
			}

			function drawStar(c, cx, cy, points, outer, inner) {
				c.beginPath();
				for (let i = 0; i < points * 2; i++) {
					const angle = (i * Math.PI) / points - Math.PI / 2;
					const r = i % 2 === 0 ? outer : inner;
					i === 0 ? c.moveTo(cx + r*Math.cos(angle), cy + r*Math.sin(angle))
						: c.lineTo(cx + r*Math.cos(angle), cy + r*Math.sin(angle));
				}
				c.closePath();
			}

			const SHAPE_TOOLS = new Set(['line','rect','filled_rect','ellipse','filled_ellipse','circle','filled_circle','star']);

			// ══════════════════════════════════════════════════════════════
			//  MOUSE EVENTS
			// ══════════════════════════════════════════════════════════════
			overlayCanvas.style.pointerEvents = 'auto';
			const eventCanvas = overlayCanvas; // capture on overlay, render on main

			eventCanvas.addEventListener('mousedown', onDown);
			eventCanvas.addEventListener('mousemove', onMove);
			window.addEventListener('mouseup', onUp);
			eventCanvas.addEventListener('contextmenu', e => e.preventDefault());

			function onDown(e) {
				const {x, y} = getCanvasPos(e);
				const color = activeColor(e);
				state.isDrawing = true;
				state.startX = x; state.startY = y;
				state.lastX = x; state.lastY = y;

				if (state.tool === 'fill') {
					saveState();
					floodFill(x, y, color);
					return;
				}
				if (state.tool === 'eyedropper') {
					const px = ctx.getImageData(x, y, 1, 1).data;
					const hex = rgbToHex(px[0], px[1], px[2]);
					if (e.button === 2) state.bg = hex; else state.fg = hex;
					updateColorUI();
					state.isDrawing = false;
					return;
				}
				if (SHAPE_TOOLS.has(state.tool)) {
					saveState();
					return;
				}

				// brush tools
				saveState();
				if (state.tool === 'spray') {
					sprayAt(x, y, color);
					state.sprayTimer = setInterval(() => {
						if (state.isDrawing) sprayAt(state.lastX, state.lastY, color);
					}, 40);
				} else {
					drawAt(x, y, x, y, color);
				}
			}

			function onMove(e) {
				const {x, y} = getCanvasPos(e);
				document.getElementById('status-pos').textContent = `${x}, ${y}`;

				if (!state.isDrawing) return;
				const color = activeColor(e);

				if (SHAPE_TOOLS.has(state.tool)) {
					previewShape(state.startX, state.startY, x, y, color, state.tool, e);
					return;
				}

				if (state.tool !== 'fill' && state.tool !== 'eyedropper') {
					drawAt(state.lastX, state.lastY, x, y, color);
				}
				state.lastX = x; state.lastY = y;
			}

			function onUp(e) {
				if (!state.isDrawing) return;
				const {x, y} = getCanvasPos(e);
				const color = activeColor(e);

				if (SHAPE_TOOLS.has(state.tool)) {
					commitShape(state.startX, state.startY, x, y, color, state.tool, e);
				}

				if (state.sprayTimer) { clearInterval(state.sprayTimer); state.sprayTimer = null; }
				state.isDrawing = false;
			}

			function drawAt(x0, y0, x1, y1, color) {
				switch(state.tool) {
					case 'pencil':
						drawLineTo(x0, y0, x1, y1, state.brushSize, color);
						break;
					case 'brush_circle':
						ctx.strokeStyle = color;
						ctx.lineWidth = state.brushSize;
						ctx.lineCap = 'round';
						ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
						break;
					case 'eraser':
						drawLineTo(x0, y0, x1, y1, state.brushSize * 3, state.bg);
						break;
				}
			}

			// ══════════════════════════════════════════════════════════════
			//  PALETTE UI
			// ══════════════════════════════════════════════════════════════
			function buildPalette() {
				const grid = document.getElementById('color-grid');
				grid.innerHTML = '';
				CONFIG.palette.forEach(hex => {
					const s = document.createElement('div');
					s.className = 'color-swatch';
					s.style.background = hex;
					s.title = hex;
					s.addEventListener('click', () => { state.fg = hex; updateColorUI(); });
					s.addEventListener('contextmenu', e => {
						e.preventDefault(); state.bg = hex; updateColorUI();
					});
					grid.appendChild(s);
				});
			}

			function updateColorUI() {
				document.getElementById('fg-color-box').style.background = state.fg;
				document.getElementById('bg-color-box').style.background = state.bg;
			}

			document.getElementById('swap-btn').addEventListener('click', swapColors);
			function swapColors() {
				[state.fg, state.bg] = [state.bg, state.fg];
				updateColorUI();
			}

			// ── Color modal ──
			let modalTarget = 'fg';
			document.getElementById('custom-color-btn').addEventListener('click', () => {
				openColorModal('fg');
			});
			document.getElementById('fg-color-box').addEventListener('click', () => openColorModal('fg'));
			document.getElementById('bg-color-box').addEventListener('click', () => openColorModal('bg'));

			function openColorModal(target) {
				modalTarget = target;
				document.getElementById('color-picker-input').value = state[target];
				document.getElementById('color-modal').classList.add('open');
			}
			document.getElementById('modal-ok').addEventListener('click', () => {
				state[modalTarget] = document.getElementById('color-picker-input').value;
				updateColorUI();
				document.getElementById('color-modal').classList.remove('open');
			});
			document.getElementById('modal-cancel').addEventListener('click', () => {
				document.getElementById('color-modal').classList.remove('open');
			});

			// ══════════════════════════════════════════════════════════════
			//  TOOL SELECTION
			// ══════════════════════════════════════════════════════════════
			document.querySelectorAll('.tool-icon').forEach(el => {
				el.addEventListener('click', () => {
					const tool = el.dataset.tool;
					if (!tool) return;
					selectTool(tool);
				});
			});

			function selectTool(tool) {
				state.tool = tool;
				document.querySelectorAll('.tool-icon').forEach(el => {
					el.classList.toggle('active', el.dataset.tool === tool);
				});
				const def = CONFIG.tools[tool];
				if (def) {
					document.getElementById('status-tool').textContent = 'Tool: ' + def.label;
					eventCanvas.style.cursor = def.cursor;
				}
			}

			// ══════════════════════════════════════════════════════════════
			//  BRUSH SIZE
			// ══════════════════════════════════════════════════════════════
			function buildBrushSizes() {
				const row = document.getElementById('bsize-row');
				row.innerHTML = '';
				CONFIG.brushSizes.forEach(sz => {
					const d = document.createElement('div');
					d.className = 'bsize-btn' + (sz === state.brushSize ? ' active' : '');
					d.dataset.size = sz;
					const visual = Math.min(sz, 20);
					d.style.width = d.style.height = visual + 'px';
					d.title = sz + 'px';
					d.addEventListener('click', () => {
						state.brushSize = sz;
						document.querySelectorAll('.bsize-btn').forEach(b => b.classList.remove('active'));
						d.classList.add('active');
					});
					row.appendChild(d);
				});
			}

			// toolbar size picker
			document.querySelectorAll('.size-opt').forEach(el => {
				el.addEventListener('click', () => {
					state.brushSize = parseInt(el.dataset.size);
					document.querySelectorAll('.size-opt').forEach(o => o.classList.remove('active'));
					el.classList.add('active');
				});
			});

			// ══════════════════════════════════════════════════════════════
			//  TOOLBAR BUTTONS
			// ══════════════════════════════════════════════════════════════
			document.getElementById('btn-undo').addEventListener('click', undo);
			document.getElementById('btn-redo').addEventListener('click', redo);
			document.getElementById('btn-new').addEventListener('click', () => {
				if (confirm('Start a new drawing? Unsaved changes will be lost.')) {
					saveState();
					ctx.fillStyle = '#ffffff';
					ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
				}
			});

			// ══════════════════════════════════════════════════════════════
			//  KEYBOARD SHORTCUTS
			// ══════════════════════════════════════════════════════════════
			window.addEventListener('keydown', e => {
				if (e.ctrlKey && e.key === 'z') { e.preventDefault(); undo(); }
				if (e.ctrlKey && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) { e.preventDefault(); redo(); }
				if (e.key === 'x' || e.key === 'X') swapColors();
				if (e.key === 'e') selectTool('eraser');
				if (e.key === 'b') selectTool('brush_circle');
				if (e.key === 'p') selectTool('pencil');
				if (e.key === 'f') selectTool('fill');
				if (e.key === 'i') selectTool('eyedropper');
				if (e.key === 'l') selectTool('line');
				if (e.key === 'r') selectTool('rect');
				if (e.key === 's') selectTool('star');
			});

			// ══════════════════════════════════════════════════════════════
			//  INIT
			// ══════════════════════════════════════════════════════════════
			function init() {
				ctx.fillStyle = '#ffffff';
				ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

				buildPalette();
				updateColorUI();
				buildBrushSizes();
				selectTool('pencil');
				document.getElementById('status-size').textContent =
					`${CONFIG.canvasWidth} × ${CONFIG.canvasHeight}`;
			}

			init();
		</script>
	</body>
</html>
